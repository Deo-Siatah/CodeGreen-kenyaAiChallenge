[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "africastalking>=2.0.2",
    "alembic>=1.20.0",
    "asyncpg>=0.30.0",
    "earthengine-api>=1.7.46",
    "fastapi>=0.138.0",
    "google-genai>=2.28.0",
    "httpx>=0.28.1",
    "langchain-groq>=1.1.3",
    "neo4j>=6.2.0",
    "psycopg>=3.3.6",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.15.18",
]

[tool.pytest.ini_options]
# "." makes `backend/` the import root, so tests can `from models import Farmer`
# the same way the rest of the codebase does (`from schemas.farmer import ...`).
# There is no `backend/__init__.py`, so the package is `models`, not `backend.models`.
pythonpath = ["."]
testpaths = ["tests"]
# "auto" so async tests do not each need a @pytest.mark.asyncio marker; this
# module is async-only in places and the marker is easy to forget.
asyncio_mode = "auto"
# One event loop for the whole session. engine_app / engine_scoring are
# module-level singletons whose pool holds asyncpg connections, and asyncpg
# connections are bound to the loop that created them. pytest-asyncio's default
# is a fresh loop per test, which makes the second test to run fail with
# "got Future attached to a different loop". A single session loop matches how
# the app actually runs - one loop for the process lifetime.
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
